<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="0 3.8 -5" height=".15" width="1.5" rotation="0 0 0" color="maroon"></a-box>
      <a-box position="0 3.65 -5" height=".15" width="1.5" rotation="0 0 0" color="black"></a-box>
      <a-box position="0 3.5 -5" height=".15" width="1.5" rotation="0 0 0" color="maroon"></a-box>
      <a-box position="-1.2 3. -5" scale=".05 2 .08" rotation="0 0 45" color="brown"></a-box>
      <a-box position="1.2 3. -5" scale=".05 2 .08" rotation="0 0 -45" color="brown"></a-box>
      <a-sphere position="0 3.25 -5" radius=".55" color="#fffff"></a-sphere>
      <a-cone position="0 3.15 -4" rotation="0 90 90" scale=".08 .75 .08 " color="yellow"></a-cone>
      <a-sphere position=".14 3.25 -4.5" radius=".06" color="black"></a-sphere>
      <a-sphere position="-.14 3.25 -4.5" radius=".06" color="black"></a-sphere>
      <a-sphere position="0 2.25 -5" radius=".85" color="grey"></a-sphere>
      <a-sphere position="0 .75 -5" radius="1.25" color="white"></a-sphere>
      <a-cylinder position="0 6.5 -5" radius="0.5" height="6.5" color="black"></a-cylinder>
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: japan; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
