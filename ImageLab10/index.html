<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="sand" src="assets/sand.jpg" >
        <img id="towel" src="assets/towel.jpg">
        <img id="metal" src="assets/metal.jpg">
        <img id="beer" src="assets/beer.jpg">
        <img id="beach" src="assets/beach .jpg">
        <img id="umbrella" src="assets/umbrella.jpg">
      </a-assets>
      <!-- <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box> -->
      <!-- <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere> -->
      <a-cylinder src=#metal position="1 2 -4" radius="0.06" height="4.5" color=""></a-cylinder>
      <a-cone src="#umbrella" position="1 4 -4" rotation="0 0 0" scale="2.5 .4 1.5" radius="100" width="1" height="2" color="pink"></a-cone>
      <!-- <a-triangle position="1 3.75 -4.3" rotation="45 0 0" width="8" height="9" color="yellow"></a-triangle> -->
      <a-cylinder src=#beer position="-1.9 .75 -3.1" rotation="0 0 0"radius=".4" height="1.5" color=""></a-cylinder>
      <a-plane src=#sand position="0 0 -4" rotation="-90 0 0" width="6" height="6" color=""></a-plane>
      <a-plane src=#towel position="0 .1 -3" rotation="-90 45 0" width="2" height="3" color=""></a-plane>
      <a-sky src="#beach" color="#ECECEC" postion="0 100 0"radius="40"></a-sky>
    </a-scene> 
  </body>
</html>
